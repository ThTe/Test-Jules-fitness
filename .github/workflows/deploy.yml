name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Déclenche l'action uniquement sur les push vers la branche main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web app
        # Construit l'application avec le bon chemin de base pour GitHub Pages
        # ${{ github.event.repository.name }} est une variable qui sera automatiquement remplacée par le nom de votre dépôt
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Le répertoire à publier (la sortie de la commande de build)
          publish_dir: ./build/web
